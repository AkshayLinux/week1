<!doctype html>
<html lang="en-US">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Validator HTML5</title>
    </head>
    <body>
        <main>
            <h1>Register now</h1>
            <form>
                <label for="name">Name: </label>
                <input id="name" type="text"><br>

                <label for="mail">E Mail: </label>
                <input id="mail" type="email"><br>

                <label for="password">Password: </label>
                <input id="password" type="text" minlength="8" pattern="(?=.*\d).{8,}" required><br>

                <label for="age">Enter your age: </label>
                <input id="age" type="number" min=18 max=99><br>

                <label for="url">Your portfolio: </label>
                <input id="url" type="url"><br>

                <label for="dob">Date of birth</label>
                <input id="dob" type="date" max="2026-06-15"><br>

                <button type="submit">Register now</button>
            </form>
        </main>
    </body>
</html>

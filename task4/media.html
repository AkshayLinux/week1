<!doctype html>
<html lang="en-US">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Video player</title>
    </head>
    <body>
        <h1>Multimedia web</h1>
        <video controls width="640" poster="https://picsum.photos/400/300?random=1">
            <source src="https://www.w3schools.com/html/mov_bbb.mp4" type="video/mp4">
            <track src="caption.vtt" kind="captions" srclang="en" label="English">
            Your browser does not support HTML5 video
        </video>
        <p>Video tag is used to show video in webpage. it has built in controls and supports poster, captions and fallback text</p>

        <audio controls>
            <source src="https://www.w3schools.com/html/mov_bbb.mp4" type="audio/mp3">
            <source src="https://www.w3schools.com/html/mov_bbb.mp4" type="audio/ogg">
            <a href="https://www.w3schools.com/html/mov_bbb.mp4">Dowload audio</a>
        </audio>
        <p>Audio tag allows to embed audio in webpage. it also have build in controls if controls attribute is used</p>
    </body>
</html>
